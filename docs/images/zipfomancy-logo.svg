<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img"
     aria-label="Zipfomancy logo: golden bars that shrink like Zipf's law, a glowing curve and a magic spark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A0A12"/>
      <stop offset="1" stop-color="#2B0708"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DC82"/>
      <stop offset="1" stop-color="#C8961B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6CC" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#D3A625" stroke-width="6"/>

  <!-- The bars follow Zipf's law: heights 1, 1/2, 1/3, 1/4, 1/5 -->
  <g fill="url(#gold)">
    <rect x="34" y="62" width="30" height="150" rx="5"/>
    <rect x="72" y="137" width="30" height="75" rx="5"/>
    <rect x="110" y="162" width="30" height="50" rx="5"/>
    <rect x="148" y="175" width="30" height="37" rx="5"/>
    <rect x="186" y="182" width="30" height="30" rx="5"/>
  </g>

  <!-- the magic trail over the bars -->
  <path d="M49 52 C58 112 84 128 125 148 S190 168 216 170" fill="none" stroke="#FFF3C4" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- the spark: a glowing four-pointed star on top of the first bar, two small ones nearby -->
  <circle cx="49" cy="38" r="26" fill="url(#glow)"/>
  <path d="M49 20 L53.5 33.5 L67 38 L53.5 42.5 L49 56 L44.5 42.5 L31 38 L44.5 33.5 Z" fill="#FFF6CC"/>
  <path d="M200 61 L202 68 L209 70 L202 72 L200 79 L198 72 L191 70 L198 68 Z" fill="#FFF6CC"/>
  <path d="M226 98 L227.5 102.5 L232 104 L227.5 105.5 L226 110 L224.5 105.5 L220 104 L224.5 102.5 Z" fill="#FFF6CC"/>
</svg>
